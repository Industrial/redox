[package]
name = "redox-fmt"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Plan 34 leaf 1: the formatter prints from the AST and slices unprinted
# constructs out of the source by their spans.
redox-ast = { path = "../redox-ast" }
# Plan 34 leaf 4: a statement's leading and trailing trivia are `redox_lexer`
# types, and the statement printer writes them back as Redox comments and
# attributes — doc 02 §10.1's rule that trivia survives, in the one direction
# the emitter does not cover.
redox-lexer = { path = "../redox-lexer" }

[dev-dependencies]
# Plan 34 §1.4: the property tests re-parse what the formatter printed.
redox-parser = { path = "../redox-parser" }
