# GENERATED from this crate's Cargo.toml — see .tmp/gen_moon.py in the
# commit that introduced it, and crates/voltaic-cli/tests/moon_project_graph.rs
# which fails if it drifts. Tasks are inherited from
# .moon/tasks/tag-crate.yml via the `crate` tag.
#
# No `dependsOn`: moon's rust toolchain reads the dependency edges out of
# Cargo.toml itself, so repeating them here would be a second copy of the
# graph free to drift from the first.
id: 'voltaic-cli'
language: 'rust'
layer: 'application'
tags:
  - 'crate'
fileGroups:
  # This crate's TRANSITIVE intra-workspace dependencies. These are inputs
  # rather than just `deps` because moon caches on inputs alone — without
  # them, a change in one of these would leave this crate's verdict
  # cached green.
  dependency_sources:
    - '/crates/voltaic-ast/src/**/*'
    - '/crates/voltaic-ast/Cargo.toml'
    - '/crates/voltaic-diag/src/**/*'
    - '/crates/voltaic-diag/Cargo.toml'
    - '/crates/voltaic-driver/src/**/*'
    - '/crates/voltaic-driver/Cargo.toml'
    - '/crates/voltaic-emit/src/**/*'
    - '/crates/voltaic-emit/Cargo.toml'
    - '/crates/voltaic-fmt/src/**/*'
    - '/crates/voltaic-fmt/Cargo.toml'
    - '/crates/voltaic-lexer/src/**/*'
    - '/crates/voltaic-lexer/Cargo.toml'
    - '/crates/voltaic-parser/src/**/*'
    - '/crates/voltaic-parser/Cargo.toml'
tasks:
  test:
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - '@group(dependency_sources)'
      - '/crates/**/*.rs'
      # The self-hosted crates' Voltaic source. `/crates/**/*.rs` does not match
      # a `.sdx`, so without this line `tests/port.rs` — which grades the
      # `.sdx` against the committed `.rs` — stays cached green when a `.sdx`
      # is edited and not regenerated, which is the exact failure it exists to
      # catch. Measured: the same task hash before and after the edit.
      - '/crates/*/sdx/**/*'
      - '/examples/**/*'
      - '/tests/**/*'
      - '/docs/**/*.md'
