[package]
name = "voltaic-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Voltaic's zero-cost benchmarks: identical optimised IR, asserted rather than timed."

# Internal. Doc 03's zero-cost claim is a gate on this repository, not a library
# anyone depends on, so it stays off crates.io and needs no `include`.
publish = false

[dependencies]
# Plan 44 leaf 2's report transpiles the corpus to time it, which needs the
# driver. Leaf 1's IR comparison needs the CLI's build path, reached by
# shelling out rather than linked — see `ir_of`.
voltaic-driver = { path = "../voltaic-driver" }
voltaic-parser = { path = "../voltaic-parser" }
voltaic-emit = { path = "../voltaic-emit" }

# The five surface-fact allows — see the root manifest.
[lints]
workspace = true
