[package]
name = "redox-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Plan 40 §1.1, verified with `cargo search` rather than assumed. Doc 02 §5.5
# names both: `lsp-server` is the transport and main loop, `lsp-types` the
# protocol's types.
lsp-server = "0.10"
lsp-types = "0.97"
# The protocol is JSON-RPC, so a server needs both halves of serde.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Everything the four capabilities answer with. The server contributes no
# analysis of its own, which is the whole shape of plan 40 — so this list is
# the plan.
redox-ast = { path = "../redox-ast" }
redox-diag = { path = "../redox-diag" }
redox-driver = { path = "../redox-driver" }
redox-fmt = { path = "../redox-fmt" }
redox-lexer = { path = "../redox-lexer" }
redox-parser = { path = "../redox-parser" }

[dev-dependencies]
# The session test reparses a fixture to count its items, so the expectation
# is derived from the parser rather than written down and left to rot.
redox-parser = { path = "../redox-parser" }

# The five surface-fact allows — see the root manifest.
[lints]
workspace = true
