[package]
name = "voltaic-diag"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Diagnostics for the Voltaic compiler: codes, spans and rendering."

# `src/` is generated from `sdx/` and is `.gitignore`d, so cargo's git file
# listing packages no Rust at all and the published crate is an empty shell.
# An `include` switches cargo to a filesystem walk, which does pick the
# generated tree up. The `*.rs` glob also leaves the `.rs.map` source maps out.
# See `docs/RELEASING.md`.
include = ["src/**/*.rs", "sdx/**/*.sdx", "Cargo.toml"]

[dependencies]
miette = { version = "7", features = ["fancy"] }

# The five surface-fact allows — see the root manifest.
[lints]
workspace = true
