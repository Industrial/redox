[package]
name = "redox-driver"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Plan 10 §1.2: a persisted cache key needs a strong, stable hash.
# `std`'s DefaultHasher is neither collision-resistant nor stable across
# releases, which for a key written to disk means last week's cache
# silently mismatches this week's.
blake3 = "1"
redox-diag = { path = "../redox-diag" }
redox-emit = { path = "../redox-emit" }
# Plan 38: `RDX1001` is a lexical lint — a `.` then the name — so the driver
# scans tokens rather than walking an AST that could silently miss a variant.
redox-lexer = { path = "../redox-lexer" }
redox-parser = { path = "../redox-parser" }
