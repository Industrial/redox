  dependency_sources:
    - '/crates/voltaic-diag/src/**/*'
    - '/crates/voltaic-diag/Cargo.toml'
    - '/crates/voltaic-lexer/src/**/*'
    - '/crates/voltaic-lexer/Cargo.toml'
