[package]
name = "redox-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# The shipped binary is `redox`; the crate stays `redox-cli` so
# `cargo build -p redox-cli` keeps working. Emerald's own convention, adopted
# for the same reason.
[[bin]]
name = "redox"
path = "src/main.rs"

[dependencies]
# Plan 12 §2.1: watching a directory means inotify on Linux, kqueue on the
# BSDs, FSEvents on macOS and ReadDirectoryChangesW on Windows — four
# platform APIs behind one interface, which is exactly the library function
# doc 02 §5.5 says not to write. The alternative is polling mtime on a
# timer, the heuristic plan 12 §1.1 exists to avoid.
notify = "8"
redox-diag = { path = "../redox-diag" }
redox-driver = { path = "../redox-driver" }
redox-emit = { path = "../redox-emit" }
# Plan 34: `redox fmt`.
redox-fmt = { path = "../redox-fmt" }
redox-parser = { path = "../redox-parser" }

[dev-dependencies]
# Plan 48 leaf 2's oracle. The conformance port is one module lifted out of a
# crate, so `crate::Stmt` cannot resolve and **rustc cannot type-check it** —
# a property of the extraction, not of Redox. `syn` answers the question that
# is actually askable about an isolated module: is this valid Rust *syntax*.
# Plan 42 §1.3 chose it as an oracle for the same reason and it is already in
# `Cargo.lock`.
syn = { version = "2", features = ["full", "parsing"] }
