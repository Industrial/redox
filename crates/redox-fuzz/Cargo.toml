[package]
name = "redox-fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Plan 42 §1.2: the target **logic** lives here, in stable Rust, so the
# ordinary gate exercises it. The libFuzzer harnesses in `fuzz/` are three-line
# wrappers around these functions and are outside the workspace.
redox-emit = { path = "../redox-emit" }
redox-lexer = { path = "../redox-lexer" }
redox-parser = { path = "../redox-parser" }

[dev-dependencies]
# Plan 42 §1.4's oracle: *the generated Rust must parse*. Already in
# `Cargo.lock` as a transitive dependency, so this adds features rather than a
# download — and it answers in microseconds where rustc takes hundreds of
# milliseconds, which is the difference between a million inputs and a
# thousand.
#
# A **dev**-dependency on purpose: the oracle belongs to the sweep that checks
# the targets, not to the targets themselves. A fuzz target's crate having zero
# dependencies beyond the compiler is Emerald's convention and doc 04 names it.
syn = { version = "2", features = ["full", "parsing"] }
