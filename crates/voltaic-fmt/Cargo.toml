[package]
name = "voltaic-fmt"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Plan 34 leaf 1: the formatter prints from the AST and slices unprinted
# constructs out of the source by their spans.
voltaic-ast = { path = "../voltaic-ast" }
# Plan 34 leaf 4: a statement's leading and trailing trivia are `voltaic_lexer`
# types, and the statement printer writes them back as Voltaic comments and
# attributes — doc 02 §10.1's rule that trivia survives, in the one direction
# the emitter does not cover.
voltaic-lexer = { path = "../voltaic-lexer" }

[dev-dependencies]
# Plan 34 §1.4: the property tests re-parse what the formatter printed.
voltaic-parser = { path = "../voltaic-parser" }

# The five surface-fact allows — see the root manifest.
[lints]
workspace = true
