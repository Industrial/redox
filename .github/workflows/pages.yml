name: Pages
# Build the book and deploy it to GitHub Pages.
#
# Identity and documentation site
# (`.cursor/plans/voltaic-identity-and-site.plan.md`) wave 9.
#
# **This job bootstraps, and it did not used to.** The first version of this
# workflow had no compiler in its graph at all: the book includes `.sdx` as
# *text* and the icons come from two SVG masters, so nothing needed building.
# That was a property worth having and it is now gone, deliberately.
#
# Syntax highlighting is why. `tools/mdbook-voltaic` highlights every sample
# with `voltaic-lexer` — the compiler's own tokenisation — rather than with a
# hand-written highlight.js grammar, because a third grammar after the parser
# and the tree-sitter one would drift silently; nothing compiles a highlighter.
# The cost of that choice is exactly this: the preprocessor links the lexer,
# the lexer's `src/` is generated from its `.sdx` and `.gitignore`d, so the
# seed bootstrap and a Rust toolchain are now build inputs for the docs site.
#
# The trade is deliberate and worth restating: a slower, compiler-coupled docs
# build against highlighting that cannot disagree with the compiler.
#
# **Tools come from Nix rather than six pinned downloads.** `ci.yml` installs
# each binary with a sha256 check because it needs exactly the Rust toolchain
# the project pins. Here the six tools — mdbook, mdbook-linkcheck2, resvg,
# oxipng, icoutils, libicns — all come from the same nixpkgs the dev shell
# uses, so one step gets versions identical to a developer's and there are six
# fewer checksums to keep current. `ci.yml`'s `format` job already does this.
#
# **`--icons-only`, so no font is downloaded.** The three banners are the only
# outputs that set type, they are tracked under `design/banners/` because
# GitHub reads the README headers from the default branch and a crawler fetches
# the OpenGraph image by URL, and rendering them needs Archivo. Pulling
# `google-fonts` here would cost about a gigabyte on every run to redraw three
# files that have not changed. `design/rasterize.sh` copies the committed
# banners into the site, so the OpenGraph image is present either way.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
# A superseded deploy is worth cancelling; a PR build doubly so.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Least privilege at the top; the deploy job opts into what it needs.
permissions:
  contents: read
env:
  # Kept equal to `rust-toolchain.toml`, the same pin `ci.yml` uses.
  RUST_TOOLCHAIN: 1.97.1
jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Build on every push and every pull request, so a broken book or a dead
  # cross-reference fails the PR rather than the deploy.
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build the book
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # The preprocessor links voltaic-lexer, whose src/ is generated — so the
      # seed bootstrap has to run before anything can be built, exactly as in
      # `ci.yml`. `wasmtime` runs the seed; the toolchain is the pinned one.
      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Bootstrap the generated Rust, then build the preprocessor
        run: |
          nix shell nixpkgs#wasmtime nixpkgs#rustfmt --command bash -c '
            set -euo pipefail
            ./bootstrap.sh
          '
          cargo build --release -p mdbook-voltaic
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: Render the identity assets
        run: |
          nix shell \
            nixpkgs#jq \
            nixpkgs#resvg \
            nixpkgs#oxipng \
            nixpkgs#icoutils \
            nixpkgs#libicns \
            --command bash -c '
              set -euo pipefail
              ./design/build.sh
              ./design/build.sh --check
              ./design/rasterize.sh --icons-only
            '
      - name: Build the book
        run: |
          nix shell \
            nixpkgs#mdbook \
            nixpkgs#mdbook-linkcheck2 \
            nixpkgs#jq \
            --command bash -c '
              set -euo pipefail
              cd www && mdbook build
            '
      - name: Annotate for crawlers and language models
        run: |
          nix shell nixpkgs#jq nixpkgs#python3 --command bash -c '
            set -euo pipefail
            cd www && ./machine.sh
          '
      # The build succeeding is not evidence that it produced anything. Each
      # of these has failed in development: an empty llms-full.txt when the
      # include expansion was wrong, a sitemap with one URL when the find was
      # scoped to the wrong directory, and pages with no canonical at all.
      - name: Verify the output is not hollow
        run: |
          set -euo pipefail
          H=www/book/html
          test -f "$H/index.html"       || { echo "no index.html"; exit 1; }
          test -f "$H/sitemap.xml"      || { echo "no sitemap"; exit 1; }
          test -f "$H/robots.txt"       || { echo "no robots.txt"; exit 1; }
          test -f "$H/llms.txt"         || { echo "no llms.txt"; exit 1; }
          test -f "$H/favicon.ico"      || { echo "no favicon — did rasterize run?"; exit 1; }
          test -f "$H/manifest.webmanifest" || { echo "no manifest"; exit 1; }

          urls=$(grep -c '<loc>' "$H/sitemap.xml")
          test "$urls" -ge 20 || { echo "sitemap lists only $urls urls"; exit 1; }

          bytes=$(wc -c < "$H/llms-full.txt")
          test "$bytes" -ge 50000 || { echo "llms-full.txt is only $bytes bytes"; exit 1; }

          left=$(grep -c '{{#include' "$H/llms-full.txt" || true)
          test "$left" -eq 0 || { echo "$left includes were not expanded"; exit 1; }

          canon=$(grep -rl 'rel="canonical"' "$H" --include='*.html' | wc -l)
          test "$canon" -ge 20 || { echo "only $canon pages carry a canonical link"; exit 1; }

          # Unhighlighted code is the defect this site shipped with once, and
          # it looks like success: the build is green and the pages are there.
          spans=$(grep -ro 'class="tok-' "$H" --include='*.html' | wc -l)
          test "$spans" -ge 500 || { echo "only $spans highlighted spans"; exit 1; }

          echo "verified: $urls sitemap urls, $bytes bytes of llms-full.txt, $canon canonicals"
      - name: Upload the artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: www/book/html
  # ──────────────────────────────────────────────────────────────────────────
  # Deploy only from the default branch. A pull request builds and verifies,
  # and stops there.
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
