name = "Redox"
grammar = "redox"
path_suffixes = ["sdx"]
line_comments = ["-- "]
tab_size = 2
hard_tabs = false
language_servers = ["redox-lsp"]
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = false },
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = [
    "string",
    "comment",
  ] },
]
