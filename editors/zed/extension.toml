# Voltaic for Zed. Plan 49 leaf 4.
#
# A Zed extension is a manifest plus `languages/<name>/` holding a config and
# the tree-sitter queries. `crates/voltaic-cli/tests/editors.rs` checks that
# every key here is one Zed documents and that every path named below exists —
# there is no `zed` on the machine this was developed on, so a manifest
# pointing at a moved file is the failure mode this directory actually has.

id = "voltaic"
name = "Voltaic"
description = "Voltaic language support — highlighting, diagnostics and formatting via voltaic-lsp."
version = "0.1.1"
schema_version = 1
authors = ["Voltaic"]
repository = "https://github.com/voltaic-lang/voltaic"

[grammars.voltaic]
# Built from this checkout rather than fetched: the grammar is in this
# repository and is not published. Replace with a `repository`/`rev` pair if
# you vendor it elsewhere.
path = "../../tree-sitter-voltaic"

[language_servers.voltaic-lsp]
name = "Voltaic Language Server"
languages = ["Voltaic"]
