# https://moonrepo.dev/docs/config/workspace
$schema: './cache/schemas/workspace.json'
# extends: './shared/workspace.yml'

# Never hash build outputs—only source and config. Avoids warnings when target/
# is cleaned or incremental artifacts are missing.
hasher:
  ignorePatterns:
    - '**/target/**'
# Rust workspace crates, plus the root for the workspace-wide tasks.
#
# Spelled out rather than globbed: the bare `crates/*` + `.` glob list also
# produced a thirteenth project for `crates/` itself — toolchain `system`,
# layer `unknown`, no manifest — which then inherited the per-crate tasks and
# would have run `blaze check -p crates` against a package that does not exist.
projects:
  globs:
    - 'crates/*'
  sources:
    project-template: '.'
vcs:
  client: 'git'
  defaultBranch: 'main'
