# A worked Voltaic project, and the answer to doc 02 §6.6: what does a Voltaic
# crate look like?
#
# It looks like an ordinary Cargo crate. No new tool, no build-system
# replacement (doc 01 §1.3) — just a build script that calls Voltaic as a
# library.
#
# `[workspace]` is empty and present on purpose: it detaches this crate from
# the repository's workspace, so it builds the way a user's crate would rather
# than inheriting the parent's lockfile and profile. That is the whole point of
# having it here.
[workspace]

[package]
name = "cargo-project"
version = "0.1.0"
edition = "2024"
publish = false

# The build script needs Voltaic as a *library*. It deliberately does not shell
# out to the `voltaic` binary: a Voltaic crate must build with `cargo build` and a
# dependency, not with a globally-installed tool (plan 09 §2.1).
#
# A real project would write `voltaic-driver = "0.1"`; the path is because this
# example lives inside the repository that provides it.
[build-dependencies]
voltaic-driver = { path = "../../crates/voltaic-driver" }
voltaic-diag = { path = "../../crates/voltaic-diag" }
