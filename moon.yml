# Root-level workspace tasks
# https://moonrepo.dev/docs/config/project
#
# Only genuinely workspace-wide tasks live here. Everything Rust and per-crate
# — check, build, test, their cargo twins, and lint — is defined once in
# .moon/tasks/tag-crate.yml and inherited by each crate through the `crate`
# tag, so `moon run :check` fans out across the eleven crates and skips the
# ones whose inputs have not changed.
#
# This project is deliberately NOT tagged `crate`: it is the workspace root
# rather than a package, so `blaze check -p project-template` would not
# resolve.
id: 'project-template'
language: 'rust'
layer: 'application'
workspace:
  inheritedTasks:
    # moon 2.5.0 applies .moon/tasks/tag-crate.yml to every project, not only
    # the ones tagged `crate` — verified with `moon task project-template:check`,
    # which resolved and reported the per-crate description. Until that scopes
    # the way its documentation says, the root has to opt out by name, or
    # `moon run :check` would also try `cargo check -p project-template`, and
    # the workspace root is not a package.
    exclude:
      - 'build'
      - 'check'
      - 'lint'
      - 'test'
tasks:
  format:
    description: 'Format the workspace with treefmt (Rust, Nix, shell, JS/TS, YAML, TOML)'
    command: 'treefmt'
    inputs:
      - 'treefmt.toml'
      - '.git/**/*'
      - '**/*.rs'
      - '**/*.nix'
      - '**/*.sh'
      - '**/*.{js,jsx,ts,tsx,json}'
      - '**/*.{yml,yaml}'
      - '**/*.toml'
      - '.github/workflows/*.yml'
    options:
      cache: false
      outputStyle: buffer-only-failure
  # Plan 73. **`voltaic fmt` was in no gate.** `:format` above is treefmt, which
  # has no `.sdx` formatter, and the only `fmt --check` in the per-crate tasks
  # is `cargo fmt --check` for Rust — so the project's own formatter had never
  # been run over the project's own 245 `.sdx` files except by hand. That is how
  # `crates/voltaic-ast/sdx` came to have 50 of 53 files non-canonical, and how a
  # formatter bug that **deleted a member's visibility** survived unnoticed.
  #
  # Both tasks call `./sdx-fmt.sh`, which owns the one list of what is and is
  # not canonical and why. Two task bodies would be two exclusion lists free to
  # drift.
  sdx-format:
    description: 'Format the canonical .sdx corpora with voltaic fmt'
    command: './sdx-fmt.sh'
    inputs:
      - 'sdx-fmt.sh'
      - '**/*.sdx'
      - 'crates/voltaic-fmt/src/**/*'
    options:
      cache: false
      outputStyle: buffer-only-failure
  sdx-format-check:
    description: 'Fail if any canonical .sdx is not formatted'
    command: './sdx-fmt.sh'
    args: ['--check']
    inputs:
      - 'sdx-fmt.sh'
      - '**/*.sdx'
      - 'crates/voltaic-fmt/src/**/*'
    options:
      cache: false
      outputStyle: buffer-only-failure
  ci-format:
    description: 'Format check for CI (treefmt with fail-on-change)'
    command: 'treefmt'
    args: ['--config-file', 'treefmt.ci.toml']
    inputs:
      - 'treefmt.ci.toml'
      - '.git/**/*'
      - '**/*.rs'
      - '**/*.nix'
      - '**/*.sh'
      - '**/*.{js,jsx,ts,tsx,json}'
      - '**/*.{yml,yaml}'
      - '**/*.toml'
      - '.github/workflows/*.yml'
    options:
      cache: false
      outputStyle: buffer-only-failure
  audit:
    description: 'Run cargo audit for known Rust security advisories'
    command: 'cargo'
    args: ['audit']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
    options:
      outputStyle: buffer-only-failure
  coverage:
    description: 'Run tests with llvm-cov and generate HTML coverage report'
    command: 'cargo'
    args: ['llvm-cov', 'nextest']
    deps: ['~:format']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    options:
      cache: false
  # Stays cargo: `blaze doc` panics in blaze_doc::places::place as of
  # 0.20261030.1. blaze has no clippy, fmt, audit or llvm-cov subcommand at
  # all, so :lint, :audit, :coverage, :fix and :bench are cargo's too.
  docs:
    description: 'Build documentation'
    command: 'cargo'
    args: ['doc', '--no-deps', '--all-features']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    options:
      cache: true
      outputStyle: buffer-only-failure
  fix:
    description: 'Auto-fix with cargo fix and clippy --fix'
    command: 'bash'
    args: ['-c', 'cargo fix --allow-dirty --allow-staged --workspace --all-features && cargo clippy --fix --allow-dirty --allow-staged --workspace --all-features -- -D warnings']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    options:
      cache: false
      outputStyle: buffer-only-failure
  # Plan 72 (`docs/66 - 72 - The Seed Compiler.md`) leaf 3. Rebuild the
  # checked-in bootstrap seed. `seed/SEED.md` records when this should be run
  # and when it is churn: whenever the seed can no longer parse this
  # repository's own `.sdx`, and not on a cadence — a new blob is ~900 KB of
  # history that does not delta-compress.
  #
  # `cache: false` because the output is a tracked file, not a build artifact
  # under `target/`: a cached no-op would leave a stale blob committed and
  # report success.
  seed-refresh:
    description: 'Rebuild seed/voltaic1.wasm from crates/voltaic-seed'
    command: 'bash'
    args:
      - '-c'
      - |
        set -e
        cargo build --release -p voltaic-seed --target wasm32-wasip1
        wasm-opt -Oz --enable-bulk-memory \
          -o seed/voltaic1.wasm \
          target/wasm32-wasip1/release/voltaic-seed.wasm
        echo "seed/voltaic1.wasm is $(stat -c %s seed/voltaic1.wasm) bytes"
        echo "now: VOLTAIC_UPDATE=1 cargo test -p voltaic-seed --test blob"
    inputs:
      - 'crates/voltaic-seed/src/**/*'
      - 'crates/voltaic-seed/Cargo.toml'
    options:
      cache: false
      outputStyle: buffer-only-failure
  bench:
    description: 'Run benchmarks (no-op if no benches)'
    command: 'bash'
    args: ['-c', 'if [ -d benches ]; then cargo bench; else echo "No benches/ directory"; fi']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
      - 'benches/**/*'
    options:
      cache: false
      outputStyle: buffer-only-failure
  # `check-docs` was removed at plan 71. It opted into
  # `clippy::missing_docs_in_private_items` under `-D warnings`, which stood at
  # 514 errors across ten crates; 396 were filled and the remaining 118 all sit
  # in `crates/voltaic-parser/src/parse/parser.rs`, where documenting them takes
  # the file past `line_cap.rs`'s 1,500-line cap. Two load-bearing rules could
  # not both hold, so the lint is gone rather than left red in the push gate.
  # `:docs` still builds the documentation.
